<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 변경</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf5f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#1b2329}.card{width:min(460px,92vw);background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 60px #5d73822c}h1{margin:0 0 8px}.sub{color:#68757e;line-height:1.6;margin-bottom:20px}label{display:block;font-weight:800;font-size:13px;margin:13px 0 6px}.pw{position:relative}.pw input{width:100%;padding:14px 52px 14px 14px;border:1px solid #ccd6db;border-radius:12px;font:inherit}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;cursor:pointer;color:#66747d;display:grid;place-items:center}.primary,.secondary{display:block;width:100%;padding:15px;border:0;border-radius:13px;font-weight:900;margin-top:14px;cursor:pointer}.primary{background:#17202a;color:#fff}.secondary{background:#e9eff1;color:#17202a}.msg{min-height:22px;margin-top:12px;text-align:center;color:#c0392b}.eye:hover{color:#17202a}.eye svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style></head><body><main class="card"><h1>비밀번호 변경</h1><div class="sub">최초 로그인 비밀번호는 반드시 변경해야 합니다.<br>이후에도 관리자 화면에서 언제든 변경할 수 있습니다.</div><label>현재 비밀번호</label><div class="pw"><input id="currentPassword" type="password" autocomplete="current-password"><button class="eye" onclick="toggle('currentPassword',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div><label>새 비밀번호 (8자 이상)</label><div class="pw"><input id="newPassword" type="password" autocomplete="new-password"><button class="eye" onclick="toggle('newPassword',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div><label>새 비밀번호 확인</label><div class="pw"><input id="confirmPassword" type="password" autocomplete="new-password"><button class="eye" onclick="toggle('confirmPassword',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div><button class="primary" onclick="changePassword()">비밀번호 변경</button><button class="secondary" onclick="goHome()">취소</button><div id="msg" class="msg"></div></main><script>function toggle(id,b){const i=document.getElementById(id),show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.7a2 2 0 0 0 2.7 2.7"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.3 3.2"/><path d="M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 19 12 19c1.5 0 2.8-.4 4-.9"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>'}async function changePassword(){msg.textContent='';if(newPassword.value!==confirmPassword.value){msg.textContent='새 비밀번호가 서로 다릅니다.';return}try{const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:currentPassword.value,newPassword:newPassword.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'변경 실패');alert('비밀번호가 변경되었습니다.');await goHome()}catch(e){msg.textContent=e.message}}async function goHome(){try{const r=await fetch('/api/auth/me',{cache:'no-store'});if(!r.ok){location.href='/login.html';return}const d=await r.json();location.href=d.user?.role==='superadmin'?'/superadmin.html':'/index.html'}catch(e){location.href='/login.html'}}fetch('/api/auth/me').then(r=>{if(!r.ok)location.href='/login.html'});</script></body></html>
