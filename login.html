<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>땡라이브 로그인</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#fff,#f4ece8 46%,#e4d5ce);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#20252b}.box{width:min(430px,92vw);background:#ffffffdf;backdrop-filter:blur(16px);border:1px solid #fff;border-radius:28px;padding:30px 34px 34px;box-shadow:0 28px 80px #73544630}.logo-wrap{height:132px;display:grid;place-items:center}.logo-mark{position:relative;width:112px;height:112px;display:grid;place-items:center;animation:logoFloat 2.8s ease-in-out infinite}.f{font-family:Georgia,serif;font-size:92px;font-weight:900;font-style:italic;line-height:1;background:linear-gradient(135deg,#7c5645,#e6b49a 42%,#fff 55%,#a86d59 72%,#624238);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 10px #a8776550)}.orbit{position:absolute;inset:15px 2px 24px;border:2px solid #c9967c;border-left-color:transparent;border-right-color:#eee0d8;border-radius:50%;transform:rotate(-20deg);animation:orbit 5s linear infinite}.star{position:absolute;color:#d19b82;text-shadow:0 0 9px #fff;font-size:15px}.s1{top:15px;right:12px}.s2{bottom:24px;left:5px;font-size:9px}.brand{text-align:center;font-family:Georgia,serif;letter-spacing:6px;font-size:22px;font-weight:800}.sub{text-align:center;color:#7c6e69;margin:5px 0 22px;font-size:13px}label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}input{width:100%;padding:15px;border:1px solid #d5c8c2;border-radius:13px;font:inherit;background:#fff}.pw{position:relative}.pw input{padding-right:68px}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#f1e8e4;border-radius:9px;padding:7px 10px;cursor:pointer;font-weight:800;color:#675a56}button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:900;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}.primary{background:#202329;color:#fff;margin-top:18px}.secondary{background:#eee7e4;color:#272727;margin-top:9px}.forgot{text-align:right;display:block;margin:9px 2px 0;color:#8b6455;font-size:13px;font-weight:800;text-decoration:none}.msg{min-height:22px;text-align:center;color:#c0392b;margin-top:12px;font-size:13px}.splash{position:fixed;inset:0;z-index:99;background:#fffaf7;display:grid;place-items:center;animation:splashOut .45s ease 1.25s forwards}.splash .logo-mark{transform:scale(1.25);animation:splashIn 1.15s cubic-bezier(.2,.8,.2,1)}@keyframes logoFloat{50%{transform:translateY(-7px)}}@keyframes orbit{to{transform:rotate(340deg)}}@keyframes splashIn{0%{opacity:0;transform:scale(.55) rotate(-8deg)}65%{opacity:1;transform:scale(1.38) rotate(2deg)}100%{transform:scale(1.25)}}@keyframes splashOut{to{opacity:0;visibility:hidden}}@media(prefers-reduced-motion:reduce){.logo-mark,.orbit,.splash .logo-mark{animation:none}.splash{display:none}}
</style></head><body><div class="splash" aria-hidden="true"><div class="logo-mark"><div class="orbit"></div><div class="f">F</div><span class="star s1">✦</span><span class="star s2">✦</span></div></div><main class="box"><div class="logo-wrap"><div class="logo-mark"><div class="orbit"></div><div class="f">F</div><span class="star s1">✦</span><span class="star s2">✦</span></div></div><div class="brand">FIRST OMS</div><div class="sub">땡라이브 통합 관리 시스템</div><label>아이디</label><input id="username" autocomplete="username" placeholder="아이디"><label>비밀번호</label><div class="pw"><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"><button type="button" class="eye" onclick="togglePw()">보기</button></div><a class="forgot" href="/forgot-password.html">비밀번호를 잊으셨나요?</a><button class="primary" onclick="login()">로그인</button><a class="btn secondary" href="/signup.html">거래처 회원가입</a><div id="msg" class="msg"></div></main><script>
function togglePw(){const i=document.getElementById('password'),b=document.querySelector('.eye');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'보기':'숨기기'}
async function login(){const b=document.querySelector('.primary'),msg=document.getElementById('msg');msg.textContent='';b.disabled=true;b.textContent='확인 중...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'로그인 실패');location.href=d.user.mustChangePassword?'/change-password.html':(d.user.role==='superadmin'?'/superadmin.html':'/index.html')}catch(e){msg.textContent=e.message}finally{b.disabled=false;b.textContent='로그인'}}
password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});fetch('/api/auth/me').then(async r=>{if(r.ok){const d=await r.json();location.href=d.user?.mustChangePassword?'/change-password.html':(d.user?.role==='superadmin'?'/superadmin.html':'/index.html')}});
</script></body></html>
