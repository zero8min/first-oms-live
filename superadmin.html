<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래처 계정 관리</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#0f1217;color:#f4f5f7;margin:0;padding:24px}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.back{background:#d9a987;color:#161616}.card{margin-top:18px;background:#191e25;border:1px solid #343b45;border-radius:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;border-bottom:1px solid #303640;text-align:left;font-size:13px}th{color:#f0cdb5}.active{background:#5fc27e}.pending{background:#e0b45f}.suspended{background:#ef7b7b}</style></head><body><div class="wrap"><div class="top"><div><h1>거래처 계정 관리</h1><div>회원가입 승인·정지·재사용을 관리합니다.</div></div><button class="btn back" onclick="logoutNow()">로그아웃</button></div><div style="margin-top:18px;background:#191e25;border:1px solid #5e4a3e;border-radius:16px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap"><div><div style="font-size:18px;font-weight:950">내 관리페이지</div><div style="color:#aeb7c2;margin-top:4px">기존 고객정보·정산자료·솔라피 설정이 유지되는 주인님 운영페이지</div></div><button class="btn back" onclick="openTenant('FIRST-MASTER',this)">내 관리페이지 들어가기</button></div><div id="box" class="card"></div></div><script>const box=document.getElementById('box');
async function load(){try{const r=await fetch('/api/admin/accounts',{credentials:'same-origin',cache:'no-store'});if(r.status===403){alert('최고관리자만 접근 가능합니다.');location.href='/index.html?tenant='+encodeURIComponent(code);return}if(r.status===401){location.href='/login.html';return}const d=await r.json();if(!r.ok)throw new Error(d.error||'계정 목록을 불러오지 못했습니다.');box.innerHTML='<table><thead><tr><th>코드</th><th>아이디</th><th>거래처</th><th>대표자</th><th>연락처</th><th>권한</th><th>상태</th><th>관리</th><th>페이지</th></tr></thead><tbody>'+d.accounts.map(a=>`<tr><td>${e(a.code)}</td><td>${e(a.username)}</td><td>${e(a.company)}</td><td>${e(a.ownerName)}</td><td>${e(a.phone)}</td><td>${e(a.role)}</td><td>${e(a.status)}</td><td>${a.role==='superadmin'?'최고관리자':`<button class="btn active" onclick="setStatus('${a.id}','active',this)">승인</button> <button class="btn pending" onclick="setStatus('${a.id}','pending',this)">대기</button> <button class="btn suspended" onclick="setStatus('${a.id}','suspended',this)">정지</button>`}</td><td>${a.role==='tenant'?`<button class="btn back" onclick="openTenant('${a.code}',this)">거래처 페이지 열기</button>`:'-'}</td></tr>`).join('')+'</tbody></table>'}catch(err){console.error(err);box.innerHTML='<div style="padding:24px;color:#ff9999">'+e(err.message||'불러오기 실패')+'</div>';}}async function openTenant(code,btn){const old=btn.textContent;try{btn.disabled=true;btn.textContent='이동중...';const r=await fetch('/api/admin/select-tenant',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(!r.ok)throw new Error(d.error||'거래처 선택 실패');location.href='/index.html'}catch(err){alert(err.message)}finally{btn.disabled=false;btn.textContent=old}}async function logoutNow(){try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}finally{location.href='/login.html'}}function e(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function setStatus(id,status,btn){if(btn&&btn.disabled)return;const label=btn?btn.textContent:'';try{if(btn){btn.disabled=true;btn.textContent='처리중...'}const r=await fetch('/api/admin/accounts/status',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('처리 실패 ('+r.status+')'));alert(status==='active'?'승인 완료되었습니다.':status==='pending'?'대기 상태로 변경했습니다.':'정지 처리했습니다.');await load()}catch(err){alert(err.message||'처리 실패')}finally{if(btn){btn.disabled=false;btn.textContent=label}}}load();</script></body></html>
