<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIRST OMS 로그인</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#0e1116;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{width:min(420px,88vw);background:#191e25;border:1px solid #3b424d;border-radius:22px;padding:30px;box-shadow:0 25px 70px #0007}.logo{font-size:34px;font-weight:900;letter-spacing:2px;color:#e8b99a}.sub{color:#aeb7c2;margin:7px 0 24px}input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #3d4653;background:#10141a;color:#fff;font-size:16px}button{background:#d9a987;color:#151515;font-weight:900;cursor:pointer}.err{color:#ff9999;min-height:22px}</style></head><body><div class="box"><div class="logo">FIRST OMS</div><div class="sub">통합 운영관리 시스템</div><input id="id" placeholder="아이디" autocomplete="username"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button onclick="login()">로그인</button><div id="err" class="err"></div></div><script>async function login(){err.textContent='';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:id.value.trim(),password:pw.value})});const d=await r.json();if(!r.ok)return err.textContent=d.error||'로그인 실패';location.href=d.user?.role==='superadmin'?'/superadmin.html':'/index.html'}pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()})</script></body></html>
