<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>땡라이브 포장리스트</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;margin:0;background:#f5f5f7;color:#171717}.wrap{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0001}.nick{font-size:29px;font-weight:900}.meta{line-height:1.7;margin:12px 0;word-break:keep-all}.item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid #eee;font-size:17px}.item input{width:25px;height:25px}.item-detail{font-size:13px;color:#666;margin-top:4px}.qty{font-weight:900}.totals{margin-top:18px;padding:15px;background:#f6f2ed;border-radius:14px;line-height:1.9;text-align:right}.grand{font-size:22px;border-top:1px solid #999;padding-top:7px}.btn{width:100%;padding:15px;border:0;border-radius:14px;background:#222;color:#fff;font-size:17px;font-weight:800;margin-top:12px}.btn.secondary{background:#ececf0;color:#171717}.btn.good{background:#16723a}.done{background:#e7f8ed;color:#16723a;padding:16px;border-radius:14px;font-weight:800}.err{color:#b00020}.tracking{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:14px;background:#fafafa}.tracking h3{margin:0 0 10px}.tracking-row{display:flex;gap:8px}.tracking-row input{min-width:0;flex:1;padding:13px;border:1px solid #bbb;border-radius:12px;font-size:16px}.tracking-row button{width:auto;margin:0;padding:12px 15px}.saved{margin-top:8px;color:#16723a;font-weight:800;word-break:break-all}.camera{display:none;margin-top:12px}.camera.show{display:block}.camera video{width:100%;max-height:330px;background:#000;border-radius:14px}.camera-help{font-size:13px;color:#666;margin-top:7px}.status{font-size:13px;margin-top:8px;color:#555}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app">포장정보를 불러오는 중입니다.</div></div>
<script>
const code=new URLSearchParams(location.search).get('code')||'';
let job=null,stream=null,scanTimer=null;
const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
async function load(){const app=document.getElementById('app');if(!code){app.innerHTML='<div class="err">QR 코드가 없습니다.</div>';return}try{const r=await fetch('/api/public/packing?code='+encodeURIComponent(code),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'조회 실패');job=d.job;render()}catch(e){app.innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
function render(){const app=document.getElementById('app');const completed=job.completedAt?`<div class="done">포장완료 · ${new Date(job.completedAt).toLocaleString('ko-KR')}</div>`:'';app.innerHTML=`${completed}<div class="nick">${esc(job.nick||'')}</div><div class="meta"><b>${esc(job.name||'')}</b><br>${esc(job.phone||'')}<br>${esc(job.address||'')}<br>방송일 ${esc((job.dates||[]).join(', '))}</div><h3>포장리스트</h3>${job.items.map((x,i)=>`<label class="item"><input type="checkbox" data-i="${i}" ${job.completedAt?'checked disabled':''}><span><b>#${esc(x.number||i+1)} ${esc(x.item)}</b><div class="item-detail">단가 ${money(x.unit)} · 금액 ${money(x.amount)}</div></span><span class="qty">${x.qty}개</span></label>`).join('')}<div class="totals"><div>상품 합계 <b>${money(job.subtotal)}</b></div><div>택배비 <b>${money(job.fee)}</b></div><div class="grand">토탈 금액 <b>${money(job.total)}</b></div></div><section class="tracking"><h3>송장 바코드</h3><div class="tracking-row"><input id="trackingInput" inputmode="numeric" autocomplete="off" placeholder="송장번호 직접 입력" value="${esc(job.trackingNumber||'')}"><button class="btn secondary" onclick="saveTracking()">저장</button></div><button class="btn secondary" onclick="startBarcodeScan()">카메라로 송장 바코드 스캔</button><div id="cameraBox" class="camera"><video id="barcodeVideo" playsinline muted></video><div class="camera-help">송장 바코드를 화면 중앙에 맞춰주세요. 인식이 어려우면 위 칸에 직접 입력하세요.</div><button class="btn secondary" onclick="stopBarcodeScan()">카메라 닫기</button></div><div id="trackingStatus" class="status">${job.trackingNumber?`<span class="saved">저장된 송장번호: ${esc(job.trackingNumber)}</span>`:'송장번호를 스캔하거나 직접 입력해 저장하세요.'}</div></section>${job.completedAt?'':'<button class="btn good" onclick="completeJob()">전체 확인 · 포장 완료</button>'}`}
async function saveTracking(value){const input=document.getElementById('trackingInput'),status=document.getElementById('trackingStatus');const trackingNumber=String(value||input?.value||'').replace(/\s+/g,'').trim();if(!trackingNumber)return alert('송장번호를 입력하거나 스캔해 주세요.');status.textContent='송장번호 저장 중...';try{const r=await fetch('/api/public/packing/tracking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,tenantCode:job.tenantCode,trackingNumber})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'송장번호 저장 실패');job.trackingNumber=d.trackingNumber;if(input)input.value=d.trackingNumber;status.innerHTML='<span class="saved">송장번호 저장 완료: '+esc(d.trackingNumber)+'</span>';stopBarcodeScan()}catch(e){status.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function startBarcodeScan(){const status=document.getElementById('trackingStatus'),box=document.getElementById('cameraBox'),video=document.getElementById('barcodeVideo');if(!('BarcodeDetector' in window)){status.innerHTML='<span class="err">이 휴대폰 브라우저는 자동 바코드 인식을 지원하지 않습니다. 송장번호를 직접 입력해 주세요.</span>';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();box.classList.add('show');const detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','itf','codabar','qr_code']});status.textContent='송장 바코드를 카메라에 맞춰주세요.';const scan=async()=>{if(!stream)return;try{const codes=await detector.detect(video);if(codes.length){const raw=String(codes[0].rawValue||'').trim();if(raw){document.getElementById('trackingInput').value=raw;await saveTracking(raw);return}}}catch(e){}scanTimer=setTimeout(scan,350)};scan()}catch(e){status.innerHTML='<span class="err">카메라를 열 수 없습니다. 권한을 허용하거나 송장번호를 직접 입력해 주세요.</span>';stopBarcodeScan()}}
function stopBarcodeScan(){if(scanTimer){clearTimeout(scanTimer);scanTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('cameraBox')?.classList.remove('show')}
async function completeJob(){const boxes=[...document.querySelectorAll('input[type=checkbox]')];if(boxes.some(x=>!x.checked)){alert('모든 품목과 수량을 확인하고 체크해 주세요.');return}if(!confirm('모든 품목의 상품명과 수량, 토탈 금액을 확인하셨나요?'))return;const worker=prompt('작업자 이름을 입력해 주세요. (선택사항)','')||'';const r=await fetch('/api/public/packing/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,tenantCode:job.tenantCode,worker})}),d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'완료 처리 실패');job.completedAt=d.completedAt;stopBarcodeScan();render()}
window.addEventListener('pagehide',stopBarcodeScan);load();
</script>
</body>
</html>
