<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>땡라이브 포장리스트</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;margin:0;background:#f5f5f7;color:#171717}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0001}.nick{font-size:30px;font-weight:900}.meta{line-height:1.7;margin:12px 0}.item{display:flex;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #eee;font-size:18px}.item input{width:26px;height:26px}.qty{font-weight:900;margin-left:auto}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#222;color:#fff;font-size:18px;font-weight:800;margin-top:18px}.done{background:#e7f8ed;color:#16723a;padding:16px;border-radius:14px;font-weight:800}.err{color:#b00020}</style></head><body><div class="wrap"><div class="card" id="app">포장정보를 불러오는 중입니다.</div></div><script>
const code=new URLSearchParams(location.search).get('code')||'';let job=null;
async function load(){const app=document.getElementById('app');if(!code){app.innerHTML='<div class="err">QR 코드가 없습니다.</div>';return}try{const r=await fetch('/api/public/packing?code='+encodeURIComponent(code),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'조회 실패');job=d.job;render()}catch(e){app.innerHTML='<div class="err">'+e.message+'</div>'}}
function render(){const app=document.getElementById('app');if(job.completedAt){app.innerHTML=`<div class="done">포장완료<br>${new Date(job.completedAt).toLocaleString('ko-KR')}</div><h1 class="nick">${job.nick||job.name}</h1>`;return}app.innerHTML=`<div class="nick">${job.nick||''}</div><div class="meta"><b>${job.name||''}</b><br>${job.phone||''}<br>${job.address||''}<br>방송일 ${job.dates.join(', ')} · 결제금액 <b>${Number(job.total).toLocaleString()}원</b></div><h3>포장리스트</h3>${job.items.map((x,i)=>`<label class="item"><input type="checkbox" data-i="${i}"><span>${x.item}</span><span class="qty">${x.qty}개</span></label>`).join('')}<button class="btn" onclick="completeJob()">포장 완료</button>`}
async function completeJob(){const boxes=[...document.querySelectorAll('input[type=checkbox]')];if(boxes.some(x=>!x.checked)){alert('모든 품목과 수량을 확인하고 체크해 주세요.');return}if(!confirm('모든 품목의 상품명과 수량을 다시 확인하셨나요? 완료 후 전산에 작업시간이 기록됩니다.'))return;const r=await fetch('/api/public/packing/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,tenantCode:job.tenantCode})}),d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'완료 처리 실패');job.completedAt=d.completedAt;render()}
load();
</script></body></html>
