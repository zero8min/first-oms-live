<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래처 회원가입</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#1b2329}.wrap{max-width:520px;margin:35px auto;padding:16px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #5d73822c}h1{margin:0 0 8px;font-size:25px}.sub{color:#68757e;margin-bottom:22px}label{display:block;font-weight:800;font-size:13px;margin:13px 0 6px}input{width:100%;padding:14px;border:1px solid #ccd6db;border-radius:12px;font:inherit}.pw{position:relative}.pw input{padding-right:52px}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;margin:0;padding:0;border:0;background:transparent;cursor:pointer;color:#66747d;display:grid;place-items:center}button,a{display:block;width:100%;padding:15px;border:0;border-radius:13px;font-weight:900;text-align:center;text-decoration:none;margin-top:14px}.primary{background:#17202a;color:#fff}.back{background:#e9eff1;color:#17202a}.result{display:none;padding:18px;border-radius:14px;background:#eaf8ee;color:#176132;margin-top:18px;line-height:1.7}.eye:hover{color:#17202a}.eye svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style></head><body><div class="wrap"><div class="card"><h1>거래처 회원가입</h1><div class="sub">가입 후 최고관리자 승인이 완료되면 사용할 수 있습니다.</div><label>거래처명</label><input id="company"><label>대표자명</label><input id="ownerName"><label>연락처</label><input id="phone" inputmode="tel"><label>로그인 아이디</label><input id="username" autocomplete="username"><label>비밀번호 (8자 이상)</label><div class="pw"><input id="password" type="password" autocomplete="new-password"><button type="button" class="eye" onclick="togglePw()" aria-label="비밀번호 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div><button class="primary" onclick="signup()">가입 신청</button><a class="back" href="/login.html">로그인으로 돌아가기</a><div id="result" class="result"></div></div></div><script>function togglePw(){const i=document.getElementById('password'),b=document.querySelector('.eye'),show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.7a2 2 0 0 0 2.7 2.7"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.3 3.2"/><path d="M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 19 12 19c1.5 0 2.8-.4 4-.9"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>'}async function signup(){try{const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company:document.getElementById('company').value,ownerName:document.getElementById('ownerName').value,phone:document.getElementById('phone').value,username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'가입 실패');result.style.display='block';result.innerHTML='<b>가입 신청 완료</b><br>거래처 코드: <b>'+d.code+'</b><br>현재 상태: 최고관리자 승인 대기';document.querySelector('.primary').disabled=true}catch(e){alert(e.message)}}</script></body></html>
