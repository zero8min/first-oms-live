<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래처 계정 관리</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#0f1217;color:#f4f5f7;margin:0;padding:24px}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.back{background:#d9a987;color:#161616}.card{margin-top:18px;background:#191e25;border:1px solid #343b45;border-radius:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;border-bottom:1px solid #303640;text-align:left;font-size:13px}th{color:#f0cdb5}.active{background:#5fc27e}.pending{background:#e0b45f}.suspended{background:#ef7b7b}</style></head><body><div class="wrap"><div class="top"><div><h1>거래처 계정 관리</h1><div>회원가입 승인·정지·재사용을 관리합니다.</div></div><button class="btn back" onclick="location.href='/index.html'">정산실로 돌아가기</button></div><div id="box" class="card"></div></div><script>async function load(){const r=await fetch('/api/admin/accounts');if(r.status===403){alert('최고관리자만 접근 가능합니다.');location.href='/index.html';return}if(r.status===401){location.href='/login.html';return}const d=await r.json();box.innerHTML='<table><thead><tr><th>코드</th><th>아이디</th><th>거래처</th><th>대표자</th><th>연락처</th><th>권한</th><th>상태</th><th>관리</th></tr></thead><tbody>'+d.accounts.map(a=>`<tr><td>${e(a.code)}</td><td>${e(a.username)}</td><td>${e(a.company)}</td><td>${e(a.ownerName)}</td><td>${e(a.phone)}</td><td>${e(a.role)}</td><td>${e(a.status)}</td><td>${a.role==='superadmin'?'최고관리자':`<button class="btn active" onclick="setStatus('${a.id}','active')">승인</button> <button class="btn pending" onclick="setStatus('${a.id}','pending')">대기</button> <button class="btn suspended" onclick="setStatus('${a.id}','suspended')">정지</button>`}</td></tr>`).join('')+'</tbody></table>'}function e(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function setStatus(id,status){const r=await fetch('/api/admin/accounts/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});const d=await r.json();if(!r.ok)return alert(d.error||'실패');load()}load();</script></body></html>
