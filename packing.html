<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>땡라이브 포장리스트</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;margin:0;background:#f5f5f7;color:#171717}.wrap{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0001}.nick{font-size:29px;font-weight:900}.meta{line-height:1.7;margin:12px 0;word-break:keep-all}.item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid #eee;font-size:17px}.item input{width:25px;height:25px}.item-detail{font-size:13px;color:#666;margin-top:4px}.qty{font-weight:900}.totals{margin-top:18px;padding:15px;background:#f6f2ed;border-radius:14px;line-height:1.9;text-align:right}.grand{font-size:22px;border-top:1px solid #999;padding-top:7px}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#222;color:#fff;font-size:18px;font-weight:800;margin-top:18px}.done{background:#e7f8ed;color:#16723a;padding:16px;border-radius:14px;font-weight:800}.err{color:#b00020}</style></head><body><div class="wrap"><div class="card" id="app">포장정보를 불러오는 중입니다.</div></div><script>const code=new URLSearchParams(location.search).get('code')||'';let job=null;const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';async function load(){const app=document.getElementById('app');if(!code){app.innerHTML='<div class="err">QR 코드가 없습니다.</div>';return}try{const r=await fetch('/api/public/packing?code='+encodeURIComponent(code),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'조회 실패');job=d.job;render()}catch(e){app.innerHTML='<div class="err">'+e.message+'</div>'}}function render(){const app=document.getElementById('app');const completed=job.completedAt?`<div class="done">포장완료 · ${new Date(job.completedAt).toLocaleString('ko-KR')}</div>`:'';app.innerHTML=`${completed}<div class="nick">${job.nick||''}</div><div class="meta"><b>${job.name||''}</b><br>${job.phone||''}<br>${job.address||''}<br>방송일 ${job.dates.join(', ')}</div><h3>포장리스트</h3>${job.items.map((x,i)=>`<label class="item"><input type="checkbox" data-i="${i}" ${job.completedAt?'checked disabled':''}><span><b>#${x.number||i+1} ${x.item}</b><div class="item-detail">단가 ${money(x.unit)} · 금액 ${money(x.amount)}</div></span><span class="qty">${x.qty}개</span></label>`).join('')}<div class="totals"><div>상품 합계 <b>${money(job.subtotal)}</b></div><div>택배비 <b>${money(job.fee)}</b></div><div class="grand">토탈 금액 <b>${money(job.total)}</b></div></div>${job.completedAt?'':'<button class="btn" onclick="completeJob()">전체 확인 · 포장 완료</button>'}`};async function completeJob(){const boxes=[...document.querySelectorAll('input[type=checkbox]')];if(boxes.some(x=>!x.checked)){alert('모든 품목과 수량을 확인하고 체크해 주세요.');return}if(!confirm('모든 품목의 상품명과 수량, 토탈 금액을 확인하셨나요?'))return;const worker=prompt('작업자 이름을 입력해 주세요. (선택사항)','')||'';const r=await fetch('/api/public/packing/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,tenantCode:job.tenantCode,worker})}),d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'완료 처리 실패');job.completedAt=d.completedAt;render()}load();</script></body></html>
