<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 변경</title><body style="font-family:sans-serif;max-width:480px;margin:50px auto;padding:20px"><h2>비밀번호 변경</h2><input id="a" type="password" placeholder="현재 비밀번호" style="width:100%;padding:12px;margin:5px"><input id="b" type="password" placeholder="새 비밀번호" style="width:100%;padding:12px;margin:5px"><button onclick="go()" style="padding:12px 20px">변경</button><script>async function go(){const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:a.value,newPassword:b.value})});const d=await r.json();alert(r.ok?'변경 완료':d.error||'실패');if(r.ok)location.href='/index.html'}</script>
