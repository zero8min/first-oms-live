<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래처 회원가입</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#1b2329}.wrap{max-width:520px;margin:35px auto;padding:16px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #5d73822c}h1{margin:0 0 8px;font-size:25px}.sub{color:#68757e;margin-bottom:22px}label{display:block;font-weight:800;font-size:13px;margin:13px 0 6px}input{width:100%;padding:14px;border:1px solid #ccd6db;border-radius:12px;font:inherit}button,a{display:block;width:100%;padding:15px;border:0;border-radius:13px;font-weight:900;text-align:center;text-decoration:none;margin-top:14px}.primary{background:#17202a;color:#fff}.back{background:#e9eff1;color:#17202a}.result{display:none;padding:18px;border-radius:14px;background:#eaf8ee;color:#176132;margin-top:18px;line-height:1.7}</style></head><body><div class="wrap"><div class="card"><h1>거래처 회원가입</h1><div class="sub">가입 후 최고관리자 승인이 완료되면 사용할 수 있습니다.</div><label>거래처명</label><input id="company"><label>대표자명</label><input id="ownerName"><label>연락처</label><input id="phone" inputmode="tel"><label>로그인 아이디</label><input id="username" autocomplete="username"><label>비밀번호 (8자 이상)</label><input id="password" type="password" autocomplete="new-password"><button class="primary" onclick="signup()">가입 신청</button><a class="back" href="/login.html">로그인으로 돌아가기</a><div id="result" class="result"></div></div></div><script>async function signup(){try{const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company:company.value,ownerName:ownerName.value,phone:phone.value,username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'가입 실패');result.style.display='block';result.innerHTML='<b>가입 신청 완료</b><br>거래처 코드: <b>'+d.code+'</b><br>현재 상태: 최고관리자 승인 대기';document.querySelector('.primary').disabled=true}catch(e){alert(e.message)}}</script></body></html>
