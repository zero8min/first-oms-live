<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래처 비밀번호 찾기</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#fff,#f4ece8 48%,#e7d8d1);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#262229}.box{width:min(440px,92vw);background:#ffffffea;border:1px solid #fff;border-radius:28px;padding:30px;box-shadow:0 28px 80px #6f4d4030}.mark{text-align:center;font-size:44px;font-weight:950;color:#bd7b68;margin-bottom:4px}.title{text-align:center;font-size:24px;font-weight:950}.sub{text-align:center;color:#81736f;font-size:13px;line-height:1.6;margin:8px 0 20px}label{display:block;font-weight:850;font-size:13px;margin:12px 0 6px}input{width:100%;padding:14px;border:1px solid #d9cbc5;border-radius:13px;font:inherit}.pw{position:relative}.pw input{padding-right:70px}.show{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#f1e8e4;border-radius:9px;padding:7px 9px;font-weight:800;cursor:pointer}button,a{width:100%;display:block;border:0;border-radius:14px;padding:14px;text-align:center;text-decoration:none;font-weight:900;font-size:15px;cursor:pointer}.primary{background:#22242a;color:#fff;margin-top:18px}.back{background:#eee7e4;color:#333;margin-top:9px}.msg{text-align:center;min-height:22px;margin-top:12px;font-size:13px;color:#b43b3b}.ok{color:#277c4c}</style></head><body><main class="box"><div class="mark">F✦</div><div class="title">거래처 비밀번호 찾기</div><div class="sub">회원가입 때 등록한 정보가 모두 일치해야 새 비밀번호를 설정할 수 있습니다.</div><label>아이디</label><input id="username" autocomplete="username"><label>거래처명</label><input id="company"><label>등록 연락처</label><input id="phone" inputmode="numeric" placeholder="숫자만 입력"><label>새 비밀번호</label><div class="pw"><input id="newPassword" type="password" autocomplete="new-password" placeholder="8자 이상"><button type="button" class="show" onclick="toggle()">보기</button></div><button class="primary" onclick="resetPw()">비밀번호 변경</button><a class="back" href="/login.html">로그인으로 돌아가기</a><div id="msg" class="msg"></div></main><script>
function toggle(){const i=document.getElementById('newPassword'),b=document.querySelector('.show');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'보기':'숨기기'}
async function resetPw(){const msg=document.getElementById('msg'),btn=document.querySelector('.primary');msg.className='msg';msg.textContent='';btn.disabled=true;btn.textContent='확인 중...';try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),company:company.value.trim(),phone:phone.value,newPassword:newPassword.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'변경 실패');msg.className='msg ok';msg.textContent=d.message;setTimeout(()=>location.href='/login.html',1200)}catch(e){msg.textContent=e.message}finally{btn.disabled=false;btn.textContent='비밀번호 변경'}}
</script></body></html>
