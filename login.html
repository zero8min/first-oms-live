<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>땡라이브 로그인</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#fff,#eaf6f7 45%,#d7e8ec);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#20252b}.box{width:min(430px,92vw);background:#ffffffdd;backdrop-filter:blur(16px);border:1px solid #fff;border-radius:28px;padding:34px;box-shadow:0 28px 80px #55707c33}.logo{height:95px;display:grid;place-items:center;font-weight:950;font-size:34px;letter-spacing:2px}.logo span{display:inline-block;background:linear-gradient(120deg,#6c4b39,#d9a987,#857268);background-clip:text;color:transparent;animation:float 2.8s ease-in-out infinite}.sub{text-align:center;color:#6b7780;margin:-8px 0 24px}label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}input{width:100%;padding:15px;border:1px solid #ccd8dd;border-radius:13px;font:inherit;background:#fff}button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:900;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}.primary{background:#17202a;color:#fff;margin-top:18px}.secondary{background:#e8eff2;color:#17202a;margin-top:10px}.msg{min-height:22px;text-align:center;color:#c0392b;margin-top:12px;font-size:13px}@keyframes float{50%{transform:translateY(-8px);filter:drop-shadow(0 10px 10px #a77d6655)}}
</style></head><body><main class="box"><div class="logo"><span>FIRST OMS</span></div><div class="sub">땡라이브 정산 서버</div><label>아이디</label><input id="username" autocomplete="username" placeholder="아이디"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"><button class="primary" onclick="login()">로그인</button><a class="btn secondary" href="/signup.html">거래처 회원가입</a><div id="msg" class="msg"></div></main><script>
async function login(){const b=document.querySelector('.primary'),msg=document.getElementById('msg');msg.textContent='';b.disabled=true;b.textContent='확인 중...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'로그인 실패');location.href=d.user.role==='superadmin'?'/index.html':'/index.html'}catch(e){msg.textContent=e.message}finally{b.disabled=false;b.textContent='로그인'}}
password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});fetch('/api/auth/me').then(r=>r.ok&&(location.href='/index.html'));
</script></body></html>
